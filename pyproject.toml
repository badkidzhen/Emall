[project]
name = "emall"
version = "0.1.0"
description = "Django backend for a distribution mall mini-program."
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["backend"]
testpaths = ["backend"]

